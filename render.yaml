services:
  - type: web
    name: ai-embedding-search-engine
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_prod.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: EMBEDDING_MODEL
        value: "paraphrase-MiniLM-L3-v2"
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true