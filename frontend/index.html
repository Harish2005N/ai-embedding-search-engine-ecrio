<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Embedding Search Engine</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>AI Embedding Search Engine</h1>
            <p>Semantic Search powered by AI + FAISS</p>
        </div>
    </header>

    <main class="container">
        <!-- Stats Section -->
        <section class="card stats-section">
            <div class="stats-grid" id="stats-grid">
                <!-- Stats will be populated here -->
                <div class="stat-box">Loading stats...</div>
            </div>
        </section>

        <div class="grid-layout">
            <!-- Add Document Section -->
            <section class="card add-section">
                <h2>Add Document</h2>
                <form id="add-form">
                    <div class="form-group">
                        <label for="doc-title">Document Title</label>
                        <input type="text" id="doc-title" placeholder="e.g. Introduction to Machine Learning" required>
                    </div>
                    <div class="form-group">
                        <label for="doc-content">Document Content</label>
                        <textarea id="doc-content" rows="6" placeholder="Machine learning enables computers..." required></textarea>
                    </div>
                    <button type="submit" class="btn primary-btn">Add Document</button>
                    <div id="add-message" class="message hidden"></div>
                </form>
            </section>

            <!-- Search Section -->
            <section class="card search-section">
                <h2>Semantic Search</h2>
                <form id="search-form">
                    <div class="form-group">
                        <label for="search-query">Search Query (Natural Language)</label>
                        <input type="text" id="search-query" placeholder="Ask something..." required>
                    </div>
                    <div class="form-group">
                        <label for="top-k">Top K Results</label>
                        <select id="top-k">
                            <option value="3">3</option>
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                    <button type="submit" class="btn primary-btn">Search</button>
                </form>
                
                <div class="search-divider"></div>
                
                <h3>Recent Searches</h3>
                <div id="recent-searches" class="recent-searches">
                    <span class="empty-state">No recent searches.</span>
                </div>
                <button id="clear-searches" class="btn clear-btn hidden">Clear Recent Searches</button>
                
                <div class="search-divider"></div>
                
                <h3>Search Results</h3>
                <div id="search-loading" class="hidden">
                    <div class="spinner"></div> Searching...
                </div>
                <div id="results-container" class="results-container">
                    <div class="empty-state">No search performed yet.</div>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
